spring:
  application:
    name: predix-bff-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/predix_bff}
    username: ${DATABASE_USERNAME:predix}
    password: ${DATABASE_PASSWORD:predix}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: predix-bff-gateway

predix:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-256-bit-secret-key!!}
    issuer: predix-bff
    access-token-ttl: ${JWT_ACCESS_TTL:PT24H}
  siwe:
    nonce-ttl: PT5M
    domain: ${SIWE_DOMAIN:predix.local}
    uri: ${SIWE_URI:https://predix.local}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  compliance:
    enabled: true
    policy-version: v1
    block-mainland-china: true
    country-priority: SG,TH,MY,PH,VN,ID
    geoip-database-path: ${GEOIP_DB_PATH:}
  session:
    ttl: PT24H
  services:
    market-schema:
      base-url: ${MARKET_SCHEMA_URL:http://localhost:8081}
    matching:
      base-url: ${MATCHING_URL:http://localhost:8082}
    bacp:
      base-url: ${BACP_URL:http://localhost:8083}
    indexer:
      base-url: ${INDEXER_URL:http://localhost:8084}
    oracle-ops:
      base-url: ${ORACLE_OPS_URL:http://localhost:8085}
  downstream:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    max-retries: 2
    retry-backoff-ms: 200

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.predix.bff: INFO
