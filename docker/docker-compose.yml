version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: predix_bff
      POSTGRES_USER: predix
      POSTGRES_PASSWORD: predix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predix"]
      interval: 5s
      timeout: 3s
      retries: 5

  predix-bff-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      DATABASE_URL: jdbc:postgresql://postgres:5432/predix_bff
      DATABASE_USERNAME: predix
      DATABASE_PASSWORD: predix
      JWT_SECRET: change-me-in-production-use-256-bit-secret-key!!
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
